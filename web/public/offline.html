<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3F5F4" />
    <title>Offline — Spare Parts ERP</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #F3F5F4; color: #24292D;
        font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px; width: 100%; text-align: center;
        background: #FFFFFF; border: 1px solid #E1E5E3; border-radius: 14px; padding: 32px 24px;
      }
      h1 { margin: 0 0 8px; color: #1B6B63; font-size: 26px; }
      p { margin: 0 0 20px; color: #66707A; }
      button {
        background: #1B6B63; color: #FFFFFF; border: 0; border-radius: 8px;
        padding: 10px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #155049; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You're offline</h1>
      <p>The shop Wi-Fi seems to be down. The app will come back as soon as the connection returns.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
