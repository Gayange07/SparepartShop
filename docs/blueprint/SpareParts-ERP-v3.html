function moreSheet(){const counts=navCounts();const items=NAV.filter(n=>!n[2].startsWith('hidden')&&navAllowed(n)&&!TABS.some(t=>t[0]===n[0]));
  modal(`<div class="head" style="margin-bottom:12px"><div><h2 style="margin:0">${esc(me.name)}</h2><div class="muted small">${ROLES[me.role]}, ${esc(db.settings.shopName)}</div></div></div>
<div class="more-grid">${items.map(n=>`<a class="${cur===n[0]?'on':''}" onclick="closeModal();go('${n[0]}')">${icon(n[4])}<span>${n[1]}</span>${counts[n[0]]?`<span class="cnt">${counts[n[0]]}</span>`:''}</a>`).join('')}
${isOwner()?'':`<a onclick="closeModal();go('mypw')">${icon('key')}<span>My password</span></a>`}<a onclick="logout()">${icon('out')}<span>Log out</span></a></div>
<div class="mfoot"><button class="btn" onclick="closeModal()">Close</button></div>`)}
function navCounts(){const due=db.preorders.filter(p=>['Pending','Arrived'].includes(p.status)&&daysBetween(today(),p.promised)<=2).length;
  return{preorders:due,missing:db.missing.filter(m=>m.status==='Open').length,jobs:db.jobs.filter(j=>j.status==='open').length}}
function toggleNav(){}
function go(v){const n=NAV.find(x=>x[0]===v);if(!n||!navAllowed(n))v='dashboard';cur=v;refreshDL();
  const counts=navCounts();document.querySelectorAll('#side a').forEach(a=>{a.classList.toggle('on',a.dataset.v===v);const c=a.querySelector('.cnt');const k=counts[a.dataset.v];if(c){if(k)c.textContent=k;else c.remove()}else if(k)a.insertAdjacentHTML('beforeend',`<span class="cnt">${k}</span>`)});
  const inTab=TABS.some(t=>t[0]===v);document.querySelectorAll('#tabbar a').forEach(a=>a.classList.toggle('on',a.dataset.t===v||(!inTab&&a.dataset.t==='more')));
  const moreCount=(counts.preorders||0)+(counts.missing||0);document.querySelectorAll('#tabbar .cnt').forEach(c=>{const k=c.dataset.c==='more'?moreCount:counts[c.dataset.c];c.textContent=k||'';c.style.display=k?'block':'none'});
  const tt=$('#tb_t');if(tt)tt.textContent=n?n[1]:'Dashboard';if(v!=='pos')posPane='parts';
  VIEWS[v]()}

/* ===================== Staff stats (used by dashboard, reports, payroll) ===================== */
function staffStats(from,to){const st={};db.users.forEach(u=>st[u.id]={u,bills:0,parts:0,jobs:0,svcs:0,sales:0,profit:0,disc:0});
  db.sales.forEach(s=>{if(s.void)return;const d=dkey(s.t);if(d<from||d>to)return;const p=saleProfit(s);
    const b=st[s.uid];if(b){b.bills++;b.parts+=sum(s.items,i=>i.qty);b.sales+=s.total;b.profit+=p;b.disc+=s.disc}
    if(s.mechId&&st[s.mechId]&&s.mechId!==s.uid){const m=st[s.mechId];m.jobs++;m.svcs+=s.services.length;m.sales+=s.total;m.profit+=p;m.parts+=sum(s.items,i=>i.qty)}
    else if(s.mechId&&st[s.mechId]){st[s.mechId].jobs++;st[s.mechId].svcs+=s.services.length}});
  return st}
function commOf(u,profit){const c=r2(Math.max(0,profit)*num(u.commPct)/100);const b=num(u.target)>0&&profit>=num(u.target)?num(u.bonus):0;return{comm:c,bonus:b}}

/* ===================== Dashboard ===================== */
VIEWS.dashboard=function(){const td=today();const mine=s=>isOwner()||s.uid===me.id;const ts=db.sales.filter(s=>!s.void&&dkey(s.t)===td&&mine(s));const low=lowStock();
  const pre=db.preorders.filter(p=>['Pending','Arrived'].includes(p.status)).sort((a,b)=>a.promised<b.promised?-1:1);
  let warn='';if(isOwner()){const lb=db.settings.lastBackup;if(!lb||Date.now()-lb>2*DAY)warn=`<div class="alert">⚠ ${lb?'Last backup: '+fdt(lb):'No backup taken yet'}. Go to <button class="linkbtn" onclick="go('settings')">Settings → Backup</button>.</div>`}
  const preHtml=`<div class="card"><h2>Pre-orders — promised dates</h2>${pre.length?tbl(['Promised','Status','Customer','Part','Qty'],pre.slice(0,10).map(p=>[dueBadge(p),p.status,`${esc(p.cust.name)}<div class="muted small">${esc(p.cust.phone)}</div>`,esc(p.partText)+' '+(p.g?gb(p.g):''),p.qty])):'<p class="muted">No pending pre-orders.</p>'}<button class="btn sm" onclick="go('preorders')">Open pre-orders</button></div>`;
  if(!isOwner()){main(`<h1>Hello ${esc(me.name)}</h1><div class="stats"><div class="stat"><div class="l">My sales today</div><div class="v">${money(sum(ts,s=>s.total))}</div><div class="muted">${ts.length} bills · ${sum(ts,s=>sum(s.items,i=>i.qty))} parts</div></div><div class="stat"><div class="l">Open service jobs</div><div class="v">${db.jobs.filter(j=>j.status==='open').length}</div></div><div class="stat"><div class="l">Low stock items</div><div class="v ${low.length?'low':''}">${low.length}</div></div></div>
<div class="row" style="margin-bottom:16px"><button class="btn pri" onclick="go('pos')">+ New Sale</button><button class="btn" onclick="newJob()">+ Service job</button><button class="btn" onclick="preModal()">+ Pre-order</button><button class="btn" onclick="missingModal()">+ Missing part</button></div>${preHtml}`);return}
  const st=staffStats(td,td);const people=Object.values(st).filter(x=>x.u.active!==false&&(x.bills||x.jobs||x.u.role!=='owner'));
  const mk=mkey(Date.now()),mst=staffStats(mk+'-01',td);
  const outst=sum(db.customers,c=>Math.max(0,custBal(c.id))),owe=sum(db.suppliers,s=>Math.max(0,supBal(s.id)));
  const chq=chequesDue(7);
  main(`<h1>Dashboard</h1>${warn}<div class="stats">
<div class="stat"><div class="l">Today's sales</div><div class="v">${money(sum(ts,s=>s.total))}</div><div class="muted">${ts.length} bills, ${sum(ts,s=>sum(s.items,i=>i.qty))} parts</div></div>
<div class="stat"><div class="l">Today's profit</div><div class="v" style="color:var(--ok)">${money(sum(ts,saleProfit))}</div><div class="muted">after ${money(sum(ts,s=>s.disc))} discount</div></div>
<div class="stat"><div class="l">Customers owe you</div><div class="v">${money(outst)}</div></div>
<div class="stat"><div class="l">You owe suppliers</div><div class="v">${money(owe)}</div><div class="muted">${chq.length?`<span class="low">${chq.length} cheque${chq.length>1?'s':''} due this week</span>`:'No cheques due'}</div></div>
<div class="stat"><div class="l">Low stock</div><div class="v ${low.length?'low':''}">${low.length}</div></div>
<div class="stat"><div class="l">Parts asked for</div><div class="v">${db.missing.filter(m=>m.status==='Open').length}</div></div></div>
<div class="card"><h2>Staff today</h2>${tbl(['Name','Role','Bills','Jobs','Parts sold','Services','Sales','Profit'],people.map(x=>[esc(x.u.name),ROLES[x.u.role],x.bills,x.jobs,x.parts,x.svcs,money(x.sales),money(x.profit)]),[2,3,4,5,6,7])}</div>
${preHtml}
<div class="card"><h2>Commission this month (so far)</h2>${tbl(['Name','Role','Profit made','Comm %','Commission','Target','Target bonus'],Object.values(mst).filter(x=>x.u.active!==false&&(num(x.u.commPct)||num(x.u.target))).map(x=>{const c=commOf(x.u,x.profit);return[esc(x.u.name),ROLES[x.u.role],money(x.profit),num(x.u.commPct)+'%',money(c.comm),num(x.u.target)?`${money(x.u.target)} <span class="pill ${x.profit>=x.u.target?'green':'amber'}">${Math.min(100,Math.round(x.profit/x.u.target*100))}%</span>`:'—',c.bonus?money(c.bonus):'—']}),[2,3,4,6])}</div>
<div class="card"><h2>Low stock — reorder needed</h2>${low.length?tbl(['Part No','Name','Grade','In stock','Reorder at'],low.slice(0,15).map(x=>[esc(x.p.partNo),esc(x.p.name),gb(x.g),`<span class="low">${x.gr.qty}</span>`,reorderOf(x.gr)]),[3,4]):'<p class="muted">All good.</p>'}</div>`)}

/* ===================== POS ===================== */
let cart=[],ps=newPS();
function newPS(){return{discPct:'',auto:true,round:false,pay:'Cash',recv:'',cust:blankCust(),jobId:null,preId:null,advance:0,mechId:''}}
function inCart(pid,g){return sum(cart.filter(x=>x.type==='part'&&x.pid===pid&&x.g===g),x=>x.qty)}
let posPane='parts';
VIEWS.pos=function(){const job=ps.jobId?db.jobs.find(j=>j.id===ps.jobId):null,pre=ps.preId?db.preorders.find(x=>x.id===ps.preId):null;
  main(`<h1>New sale</h1>${job?`<div class="alert">Billing service job <b>${esc(job.no)}</b> for mechanic <b>${esc(staffName(job.mechId))}</b>. <button class="linkbtn" onclick="clearCart()">Cancel</button></div>`:''}${pre?`<div class="alert">Delivering pre-order <b>${esc(pre.no)}</b>. The advance of ${money(pre.advance)} is deducted. <button class="linkbtn" onclick="clearCart()">Cancel</button></div>`:''}
<div class="seg only-m" id="posseg"><button data-p="parts" onclick="setPane('parts')">Find parts</button><button data-p="bill" onclick="setPane('bill')">Bill <span id="seg_n"></span></button></div>
<div class="pos" id="posw" data-pane="${posPane}"><div class="partspane"><div class="card"><h2>Find parts</h2>${picker('pp',{mode:'sell',used:inCart,onPick:addCart,ph:'Part name or number'})}
<div class="row" style="margin-top:12px"><button class="btn" onclick="missingModal(pkCtx('pp'))">Part not available</button><button class="btn" onclick="svcAddModal()">Add service charge</button></div></div></div>
<div class="billpane"><div class="card"><h2>Customer and vehicle</h2>${custFields('pc')}</div><div class="card" id="cartbox"></div></div></div>
<div class="billbar" id="billbar"><div><div class="small muted" id="bb_n"></div><div class="bt" id="bb_t"></div></div><button class="btn pri" id="bb_b"></button></div>`);
  $('#main').classList.add('haspos');pickerInit('pp');custBind('pc',ps.cust);renderCart();setPane(posPane,true)}
function setPane(p,quiet){posPane=p;const w=$('#posw');if(!w)return;w.dataset.pane=p;document.querySelectorAll('#posseg button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));if(!quiet)window.scrollTo(0,0);updBar()}
function updBar(){const bb=$('#billbar');if(!bb)return;const c=calc();const n=sum(cart,l=>l.qty);bb.classList.toggle('empty',!cart.length);
  $('#bb_n').textContent=`${n} item${n===1?'':'s'} on the bill`;$('#bb_t').textContent=money(c.due);$('#seg_n').textContent=cart.length?`(${cart.length})`:'';
  const b=$('#bb_b');if(posPane==='parts'){b.textContent='Review bill';b.onclick=()=>setPane('bill')}else{b.textContent='Complete sale';b.onclick=checkout}}
function addCart(pid,g){const p=partById(pid),gr=p.grades[g];const l=cart.find(x=>x.type==='part'&&x.pid===pid&&x.g===g);
  if((l?l.qty:0)+1>num(gr.qty))return toast('Not enough stock');
  if(l)l.qty++;else cart.push({type:'part',pid,g,qty:1,price:num(gr.price),cost:num(gr.cost),partNo:p.partNo,name:p.name});
  if(!ps.cust.mfr&&p.manufacturer&&PK.pp&&PK.pp.mfr){ps.cust.mfr=PK.pp.mfr;ps.cust.model=PK.pp.model;custBind('pc',ps.cust)}
  renderCart();pickerRun('pp');toast(p.name+', '+GL(g)+' added')}
function svcAddModal(){if(!db.svcList.length)return toast('No services in the price list. Owner can add them in Service Jobs.');
  modal(`<h2>Add service charge</h2><label>Service</label><select id="sv_s">${db.svcList.map(s=>`<option value="${s.id}">${esc(s.name)} — ${money(s.price)}</option>`).join('')}</select>
<label style="margin-top:10px">Mechanic who did the work</label><select id="sv_m"><option value="">— select —</option>${mechanics().map(m=>`<option value="${m.id}" ${m.id===ps.mechId?'selected':''}>${esc(m.name)}</option>`).join('')}</select>
<div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="svcAdd()">Add</button></div>`)}
function svcAdd(){const s=db.svcList.find(x=>x.id===$('#sv_s').value),m=$('#sv_m').value;if(!m)return toast('Select the mechanic');ps.mechId=m;cart.push({type:'svc',name:s.name,price:num(s.price),qty:1,cost:0});closeModal();renderCart()}
function setQty(i,v){const l=cart[i];v=Math.floor(num(v));if(v<=0){cart.splice(i,1)}else if(l.type==='part'){const st=num(partById(l.pid).grades[l.g].qty);if(v>st){toast('Only '+st+' in stock');l.qty=st}else l.qty=v}else l.qty=v;renderCart();pickerRun('pp')}
function rmLine(i){cart.splice(i,1);renderCart();pickerRun('pp')}
function calc(){const S=db.settings;const sub=r2(sum(cart,l=>l.qty*l.price));const elig=num(S.autoDiscPct)>0&&sub>=num(S.autoDiscOver);const autoOn=elig&&ps.auto;
  let pct=autoOn?num(S.autoDiscPct):Math.max(0,num(ps.discPct));let capped=false;if(!isOwner()&&!autoOn&&pct>num(S.maxDiscPct)){pct=num(S.maxDiscPct);capped=true}
  const disc=r2(sub*pct/100),tax=r2((sub-disc)*num(S.taxRate)/100),raw=r2(sub-disc+tax);let total=raw;
  if(ps.round){const st=num(S.roundTo)||10;total=S.roundMode==='nearest'?Math.round(raw/st)*st:Math.floor(raw/st)*st}
  const adv=Math.min(num(ps.advance),total);return{sub,elig,autoOn,pct,capped,disc,tax,raw,roundAdj:r2(total-raw),total:r2(total),adv,due:r2(total-adv)}}
function renderCart(){const box=$('#cartbox');if(!box)return;const S=db.settings;
  box.innerHTML=`<div class="head" style="margin-bottom:8px"><h2 style="margin:0">Bill <span class="muted" style="font-weight:400">(${cart.length})</span></h2><span class="small muted">Billed by <b>${esc(me.name)}</b></span></div>
${cart.length?`<div class="cl">${cart.map((l,i)=>`<div class="cli"><div class="cli-i">${esc(l.name)} ${l.type==='part'?gb(l.g):'<span class="pill blue">Service</span>'}<div class="muted small">${l.type==='part'?esc(l.partNo)+', ':''}${f2(l.price)} each</div></div><div class="step"><button onclick="setQty(${i},${l.qty-1})" aria-label="One less">−</button><input type="number" min="0" value="${l.qty}" inputmode="numeric" onchange="setQty(${i},this.value)"><button onclick="setQty(${i},${l.qty+1})" aria-label="One more">+</button></div><div class="cli-a">${f2(l.qty*l.price)}</div><button class="xbtn" onclick="rmLine(${i})" aria-label="Remove ${esc(l.name)}">×</button></div>`).join('')}</div>`:'<p class="muted">No items yet. Find a part and tap a grade to add it.</p>'}
<div style="margin-top:12px"><div class="tot"><span>Subtotal</span><span id="t_sub"></span></div>
<div class="tot" id="autorow" style="display:none;background:#f2f7ff;padding:6px 8px;border-radius:6px"><label class="chk"><input type="checkbox" id="p_auto"> Big bill discount ${num(S.autoDiscPct)}% <span class="muted small">(bill over ${money(S.autoDiscOver)})</span></label></div>
<div class="tot"><span>Discount % <span class="muted small">${isOwner()?'':'(max '+num(S.maxDiscPct)+'%)'}</span></span><input id="p_disc" type="number" min="0" step="0.5" style="width:110px;text-align:right"></div>
<div class="tot"><span>Discount amount</span><span id="t_disc"></span></div>
${num(S.taxRate)?`<div class="tot"><span>Tax (${S.taxRate}%)</span><span id="t_tax"></span></div>`:''}
<div class="tot"><label class="chk"><input type="checkbox" id="p_round"> Round off total <span class="muted small">(${S.roundMode==='nearest'?'nearest':'down to'} Rs. ${num(S.roundTo)||10})</span></label><span id="t_round"></span></div>
<div class="tot big"><span>TOTAL</span><span id="t_tot"></span></div>
<div id="advrow" style="display:none"><div class="tot"><span>Less: advance paid</span><span id="t_adv"></span></div><div class="tot big" style="border-top:0;margin-top:0"><span>TO PAY</span><span id="t_due"></span></div></div></div>
<div class="row" style="margin-top:12px"><div class="grow"><label>Payment</label><select id="p_pay"><option>Cash</option><option>Card</option><option value="Credit">Credit (owner password)</option></select></div><div class="grow" id="recvwrap"><label>Cash received</label><input id="p_recv" type="number" min="0" inputmode="decimal"></div></div>
<div class="tot" id="changerow" style="margin-top:6px"><span>Change to give</span><b id="t_chg"></b></div>
<div class="row" style="margin-top:14px"><button class="btn" onclick="clearCart()">Clear</button><button class="btn ok grow" style="font-size:16px;padding:12px" onclick="checkout()" ${cart.length?'':'disabled'}>Complete sale</button></div>`;
  $('#p_pay').value=ps.pay;$('#p_recv').value=ps.recv;$('#p_round').checked=ps.round;$('#p_auto').checked=ps.auto;$('#p_disc').value=ps.discPct;
  $('#p_disc').oninput=e=>{ps.discPct=e.target.value;updTot()};$('#p_recv').oninput=e=>{ps.recv=e.target.value;updTot()};$('#p_pay').onchange=e=>{ps.pay=e.target.value;updTot()};
  $('#p_round').onchange=e=>{ps.round=e.target.checked;updTot()};$('#p_auto').onchange=e=>{ps.auto=e.target.checked;updTot()};updTot()}
function updTot(){const c=calc();const set=(id,v)=>{const el=$('#'+id);if(el)el.textContent=v};
  set('t_sub',money(c.sub));set('t_disc',c.disc?'− '+money(c.disc)+(c.capped?' (limited to max)':''):'—');set('t_tax',money(c.tax));set('t_round',ps.round?(c.roundAdj?money(c.roundAdj):'0.00'):'');set('t_tot',money(c.total));
  $('#autorow').style.display=c.elig?'flex':'none';const pd=$('#p_disc');if(c.autoOn){pd.disabled=true;pd.value=c.pct}else{pd.disabled=false;if(document.activeElement!==pd)pd.value=ps.discPct}
  $('#advrow').style.display=c.adv?'block':'none';set('t_adv','− '+money(c.adv));set('t_due',money(c.due));
  const cash=ps.pay==='Cash';$('#recvwrap').style.visibility=cash?'visible':'hidden';$('#changerow').style.display=cash?'flex':'none';
  const ch=num(ps.recv)-c.due;set('t_chg',ps.recv===''?'—':money(ch));$('#t_chg').className=ch<0?'low':'';updBar()}
function clearCart(){cart=[];ps=newPS();posPane='parts';if(cur==='pos')VIEWS.pos()}
function checkout(){if(!cart.length||modalOpen())return;
  for(const l of cart.filter(x=>x.type==='part')){const p=partById(l.pid);if(!p||l.qty>num(p.grades[l.g].qty))return toast('Stock changed for '+l.name+' — check the quantity')}
  const c=calc();if(ps.pay==='Cash'&&ps.recv!==''&&num(ps.recv)<c.due)return toast('Cash received is less than the amount to pay');
  if(ps.pay==='Credit'){if(!ps.cust.name.trim())return toast('Enter the customer name for a credit sale');return creditModal()}
  finalize({})}
function creditModal(){const c=calc();const cu=ps.cust.id?custById(ps.cust.id):null;
  modal(`<h2>Credit sale — ${money(c.due)}</h2><p>Customer: <b>${esc(ps.cust.name)}</b> ${esc(ps.cust.phone)}${cu?`<br>Current balance: <b>${money(custBal(cu.id))}</b>${num(cu.limit)?' · limit '+money(cu.limit):''}`:' <span class="pill">new customer</span>'}</p>
<div class="row"><div class="grow"><label>Paid now (Rs.)</label><input id="cr_adv" type="number" min="0" value="0"></div><div class="grow"><label>Owner authorization password *</label><input id="cr_pw" type="password"></div></div>
<div id="cr_err" class="low" style="margin-top:8px"></div><div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn ok" onclick="doCredit()">Approve &amp; complete</button></div>`);
  $('#cr_pw').onkeydown=e=>{if(e.key==='Enter')doCredit()}}
function doCredit(){const c=calc();const err=m=>{$('#cr_err').textContent=m};const adv=r2(num($('#cr_adv').value));
  if(adv<0)return err('Invalid amount');if(adv>=c.due)return err('That covers the full bill — use Cash instead');
  if(!checkAuth($('#cr_pw').value)){log('Credit auth FAILED',money(c.due)+' · '+ps.cust.name);return err('Wrong authorization password')}
  const cu=ps.cust.id?custById(ps.cust.id):null;if(cu&&num(cu.limit)){const nb=custBal(cu.id)+c.due-adv;if(nb>num(cu.limit)&&!confirm(`${cu.name} will owe ${money(nb)}, above the limit of ${money(cu.limit)}. Continue?`))return}
  closeModal();finalize({paid:adv,approved:true})}
function finalize(o){const c=calc();const cid=resolveCustomer(ps.cust);const inv=seq('INV');const cash=ps.pay==='Cash';const recv=cash?(ps.recv===''?c.due:r2(num(ps.recv))):null;
  const parts=cart.filter(l=>l.type==='part'),svcs=cart.filter(l=>l.type==='svc');const k=ps.cust;
  const s={id:uid(),inv,t:Date.now(),uid:me.id,uname:me.name,items:parts.map(l=>({pid:l.pid,g:l.g,qty:l.qty,price:l.price,cost:l.cost,partNo:l.partNo,name:l.name})),services:svcs.map(l=>({name:l.name,price:l.price,qty:l.qty})),
    sub:c.sub,pct:c.pct,auto:c.autoOn,disc:c.disc,tax:c.tax,roundAdj:c.roundAdj,total:c.total,advance:c.adv,pay:ps.pay,paid:ps.pay==='Credit'?r2(c.adv+o.paid):c.total,recv,change:cash?r2(recv-c.due):null,
    customerId:cid,cname:k.name.trim(),cphone:k.phone.trim(),vehicleNo:k.vehicleNo.trim(),mfr:k.mfr.trim(),model:k.model.trim(),mechId:ps.mechId||null,mechName:ps.mechId?staffName(ps.mechId):'',jobId:ps.jobId,preId:ps.preId,approved:!!o.approved,void:false};
  s.items.forEach(i=>{const p=partById(i.pid);p.grades[i.g].qty=num(p.grades[i.g].qty)-i.qty;db.moves.push({t:s.t,pid:i.pid,g:i.g,qty:-i.qty,why:'Sale '+inv,u:me.name})});
  if(ps.jobId){const j=db.jobs.find(x=>x.id===ps.jobId);if(j){j.status='billed';j.saleId=s.id;j.inv=inv}}
  if(ps.preId){const p=db.preorders.find(x=>x.id===ps.preId);if(p){p.status='Delivered';p.inv=inv;p.doneT=Date.now()}}
  db.sales.push(s);log('Sale',`${inv} · ${money(s.total)} · ${s.pay}${s.pct?' · disc '+s.pct+'%'+(s.auto?' (auto)':''):''}${s.cname?' · '+s.cname:''}`);
  if(s.pay==='Credit')log('Credit approved',`${inv} · ${s.cname} · on credit ${money(s.total-s.paid)}`);
  flush();cart=[];ps=newPS();posPane='parts';VIEWS.pos();showReceipt(s,true)}

/* ===================== Receipts ===================== */
function rWidth(){return String(db.settings.paper)==='58'?'48mm':'72mm'}
function rHead(){const s=db.settings;return `<div class="c"><div class="bigt">${esc(s.shopName)}</div>${s.address?esc(s.address)+'<br>':''}${s.phone?'Tel: '+esc(s.phone):''}</div><hr>`}
function receiptHTML(s){const cu=s.customerId?custById(s.customerId):null;const tr=(a,b,cls)=>`<tr${cls?` class="${cls}"`:''}><td>${a}</td><td class="r">${b}</td></tr>`;
  return `<div class="rcpt" style="width:${rWidth()}">${rHead()}${s.void?'<div class="c bigt">*** VOIDED ***</div>':''}
<table>${tr('Invoice',esc(s.inv))}${tr('Date',fdt(s.t))}${tr('Billed by',esc(s.uname))}${s.cname?tr('Customer',esc(s.cname)):''}${s.vehicleNo?tr('Vehicle',esc(s.vehicleNo)):''}${s.model?tr('Model',esc((s.mfr?s.mfr+' ':'')+s.model)):''}${s.mechName?tr('Mechanic',esc(s.mechName)):''}</table><hr>
<table>${s.items.map(i=>`<tr><td colspan="2">${esc(i.name)} [${GL(i.g)}]</td></tr><tr><td>&nbsp;${esc(i.partNo)}  ${i.qty} x ${f2(i.price)}</td><td class="r">${f2(i.qty*i.price)}</td></tr>`).join('')}
${s.services.map(v=>`<tr><td colspan="2">${esc(v.name)} (service)</td></tr><tr><td>&nbsp;${v.qty} x ${f2(v.price)}</td><td class="r">${f2(v.qty*v.price)}</td></tr>`).join('')}</table><hr>
<table>${tr('Subtotal',f2(s.sub))}${s.disc?tr(`Discount ${s.pct}%`,'-'+f2(s.disc)):''}${s.tax?tr('Tax',f2(s.tax)):''}${s.roundAdj?tr('Round off',f2(s.roundAdj)):''}${tr('TOTAL',f2(s.total),'bigt')}
${s.advance?tr('Advance paid','-'+f2(s.advance))+tr('TO PAY',f2(s.total-s.advance),'bigt'):''}
${s.pay==='Cash'?tr('Cash',f2(s.recv))+tr('Change',f2(s.change)):''}${s.pay==='Card'?tr('Paid by card',f2(s.total-(s.advance||0))):''}
${s.pay==='Credit'?tr('Paid now',f2(s.paid-(s.advance||0)))+tr('<b>On credit</b>','<b>'+f2(s.total-s.paid)+'</b>')+(cu?tr('Outstanding now',f2(custBal(cu.id))):''):''}</table><hr>
<div class="c">Items: ${sum(s.items,i=>i.qty)}${s.disc?`<br>You saved Rs. ${f2(s.disc)}`:''}<br>${esc(db.settings.footer).replace(/\n/g,'<br>')}</div>${s.pay==='Credit'?'<br>Customer signature:<br><br>..............................':''}<br>&nbsp;</div>`}
function printHTML(h){$('#print-area').innerHTML=h;setTimeout(()=>window.print(),60)}
function showReceipt(s,isNew){modal(`<h2>${isNew?'Sale completed ✔':'Invoice '+esc(s.inv)}</h2>${s.void?`<div class="alert red">Voided by ${esc(s.voidBy)} on ${fdt(s.voidT)} — ${esc(s.voidReason)}</div>`:''}<div class="rcpt-prev">${receiptHTML(s)}</div>
<div class="mfoot"><button class="btn" id="rc">${isNew?'New sale':'Close'}</button><button class="btn pri" id="rp">🖨 Print receipt</button></div>`);
  $('#rp').onclick=()=>printHTML(receiptHTML(s));$('#rc').onclick=closeModal;setTimeout(()=>$('#rp')&&$('#rp').focus(),60)}
function testPrint(){const s=db.settings;printHTML(`<div class="rcpt" style="width:${rWidth()}">${rHead()}<div class="c bigt">TEST PRINT</div><hr>Paper: ${s.paper} mm<br>If this fits and is not cut off, the printer is set up correctly.<hr><div class="c">${esc(s.footer)}</div><br>&nbsp;</div>`)}

/* ===================== Service jobs ===================== */
let jobTab='open',editJob=null;
VIEWS.jobs=function(){if(editJob)return jobEditor();
  const list=db.jobs.filter(j=>jobTab==='open'?j.status==='open':j.status==='billed').slice().reverse();
  main(`<div class="head"><h1>Service Jobs</h1><div class="row">${isOwner()?'<button class="btn" onclick="svcListModal()">Service price list</button>':''}<button class="btn pri" onclick="newJob()">+ New service job</button></div></div>
${tabs([['open',`Open (${db.jobs.filter(j=>j.status==='open').length})`],['billed','Billed (history)']],jobTab,'setJobTab')}
<div class="card">${tbl(['Job','Date','Customer','Vehicle','Mechanic','Work','Estimate',''],list.slice(0,300).map(j=>[`<b>${esc(j.no)}</b>`,fdt(j.t),`${esc(j.cust.name)}<div class="muted small">${esc(j.cust.phone)}</div>`,`${esc(j.cust.vehicleNo)}<div class="muted small">${esc([j.cust.mfr,j.cust.model].filter(Boolean).join(' '))}</div>`,esc(staffName(j.mechId)),
  `${j.services.length} service(s), ${sum(j.parts,p=>p.qty)} part(s)`,money(jobTotal(j)),j.status==='open'?`<button class="btn sm" onclick="openJob('${j.id}')">Open</button> <button class="btn sm ok" onclick="jobToPOS('${j.id}')">Send to POS →</button>`:`<button class="btn sm" onclick="viewSale('${j.saleId}')">Bill ${esc(j.inv||'')}</button>`]),[6])}</div>`)}
function setJobTab(t){jobTab=t;VIEWS.jobs()}
function jobTotal(j){return sum(j.services,s=>s.price*(s.qty||1))+sum(j.parts,p=>{const pp=partById(p.pid);return p.qty*(pp?num(pp.grades[p.g].price):0)})}
function newJob(){editJob={id:null,no:'',t:Date.now(),cust:blankCust(),mechId:'',services:[],parts:[],note:'',status:'open',by:me.name};if(cur!=='jobs')go('jobs');else VIEWS.jobs()}
function openJob(id){editJob=JSON.parse(JSON.stringify(db.jobs.find(j=>j.id===id)));VIEWS.jobs()}
function jobEditor(){const j=editJob;
  main(`<div class="head"><h1>${j.no?'Service job '+esc(j.no):'New service job'}</h1><button class="btn" onclick="editJob=null;VIEWS.jobs()">← Back to jobs</button></div>
<div class="pos"><div><div class="card"><h2>Customer &amp; vehicle</h2>${custFields('jc')}
<div class="row" style="margin-top:10px"><div class="grow"><label>Mechanic *</label><select id="jc_mech"><option value="">— select mechanic —</option>${mechanics().map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div></div>
<label style="margin-top:10px">Complaint / notes</label><textarea id="jc_note" rows="2">${esc(j.note)}</textarea></div>
<div class="card"><h2>Parts used</h2>${picker('jp',{mode:'sell',used:(pid,g)=>sum(editJob.parts.filter(x=>x.pid===pid&&x.g===g),x=>x.qty),onPick:jobAddPart})}</div></div>
<div class="card" id="jobbox"></div></div>`);
  custBind('jc',j.cust);$('#jc_mech').value=j.mechId;$('#jc_mech').onchange=e=>j.mechId=e.target.value;$('#jc_note').oninput=e=>j.note=e.target.value;pickerInit('jp');jobBox()}
function jobAddPart(pid,g){const p=partById(pid);const l=editJob.parts.find(x=>x.pid===pid&&x.g===g);const have=num(p.grades[g].qty);if((l?l.qty:0)+1>have)return toast('Not enough stock');
  if(l)l.qty++;else editJob.parts.push({pid,g,qty:1,t:Date.now(),partNo:p.partNo,name:p.name});jobBox();pickerRun('jp')}
function jobBox(){const j=editJob;const box=$('#jobbox');
  box.innerHTML=`<h2>Work done</h2>
<div class="row"><div class="grow"><select id="jb_svc">${db.svcList.map(s=>`<option value="${s.id}">${esc(s.name)} — ${money(s.price)}</option>`).join('')}</select></div><button class="btn" onclick="jobAddSvc()">+ Add service</button></div>
${j.services.length?`<div class="tw" style="margin-top:8px"><table class="lines"><tr><th>Service</th><th class="n">Price</th><th></th></tr>${j.services.map((s,i)=>`<tr><td>${esc(s.name)}</td><td class="n">${isOwner()?`<input type="number" value="${s.price}" style="width:100px;text-align:right" onchange="editJob.services[${i}].price=num(this.value);jobBox()">`:money(s.price)}</td><td><button class="btn sm bad" onclick="editJob.services.splice(${i},1);jobBox()">✕</button></td></tr>`).join('')}</table></div>`:'<p class="muted small">No services added yet.</p>'}
<h2 style="margin-top:14px">Parts</h2>${j.parts.length?`<div class="tw"><table class="lines"><tr><th>Part</th><th style="width:64px">Qty</th><th>Added</th><th></th></tr>${j.parts.map((p,i)=>`<tr><td>${esc(p.name)} ${gb(p.g)}<div class="muted small">${esc(p.partNo)}</div></td><td><input type="number" min="1" value="${p.qty}" onchange="jobQty(${i},this.value)"></td><td class="small">${fdt(p.t)}</td><td><button class="btn sm bad" onclick="editJob.parts.splice(${i},1);jobBox();pickerRun('jp')">✕</button></td></tr>`).join('')}</table></div>`:'<p class="muted small">No parts yet — search on the left.</p>'}
<div class="tot big"><span>Estimate</span><span>${money(jobTotal(j))}</span></div><p class="muted small">Stock is deducted when the job is billed at the POS. Service prices come from the owner's price list.</p>
<div class="row" style="margin-top:10px">${j.id?`<button class="btn bad" onclick="delJob()">Delete</button>`:''}<button class="btn grow" onclick="saveJob(false)">💾 Save job</button><button class="btn ok grow" onclick="saveJob(true)">Save &amp; send to POS →</button></div>`}
function jobAddSvc(){const s=db.svcList.find(x=>x.id===$('#jb_svc').value);if(!s)return;editJob.services.push({name:s.name,price:num(s.price),qty:1});jobBox()}
function jobQty(i,v){const p=editJob.parts[i];v=Math.max(1,Math.floor(num(v)));const have=num(partById(p.pid).grades[p.g].qty);if(v>have){toast('Only '+have+' in stock');v=have}p.qty=v;jobBox()}
function saveJob(toPos){const j=editJob;if(!j.cust.name.trim())return toast('Enter the customer name');if(!j.mechId)return toast('Select the mechanic');if(!j.services.length&&!j.parts.length)return toast('Add at least one service or part');
  resolveCustomer(j.cust);if(!j.id){j.id=uid();j.no=seq('JOB');db.jobs.push(j);log('Service job created',`${j.no} · ${j.cust.name} · ${staffName(j.mechId)}`)}
  else{const ix=db.jobs.findIndex(x=>x.id===j.id);db.jobs[ix]=j;log('Service job updated',j.no)}
  flush();editJob=null;toast('Job saved');if(toPos)jobToPOS(j.id);else{VIEWS.jobs();go('jobs')}}
function delJob(){if(!confirm('Delete this job?'))return;db.jobs=db.jobs.filter(x=>x.id!==editJob.id);log('Service job deleted',editJob.no);editJob=null;save();VIEWS.jobs()}
function jobToPOS(id){const j=db.jobs.find(x=>x.id===id);if(cart.length&&!confirm('The POS already has items in the bill. Replace them with this job?'))return;
  cart=[];for(const p of j.parts){const pp=partById(p.pid);if(!pp)continue;const have=num(pp.grades[p.g].qty);if(p.qty>have){toast(`Only ${have} of ${pp.name} in stock`)}const q=Math.min(p.qty,have);if(q>0)cart.push({type:'part',pid:p.pid,g:p.g,qty:q,price:num(pp.grades[p.g].price),cost:num(pp.grades[p.g].cost),partNo:pp.partNo,name:pp.name})}
  j.services.forEach(s=>cart.push({type:'svc',name:s.name,price:num(s.price),qty:s.qty||1,cost:0}));
  ps=newPS();ps.cust=Object.assign(blankCust(),j.cust);ps.jobId=j.id;ps.mechId=j.mechId;go('pos')}
function svcListModal(){const rows=()=>db.svcList.map((s,i)=>`<tr><td><input value="${esc(s.name)}" onchange="db.svcList[${i}].name=this.value"></td><td><input type="number" value="${s.price}" style="width:110px" onchange="db.svcList[${i}].price=num(this.value)"></td><td><button class="btn sm bad" onclick="db.svcList.splice(${i},1);svcListModal()">✕</button></td></tr>`).join('');
  modal(`<h2>Service price list</h2><p class="muted">Only you (owner) can set service prices. Staff pick from this list.</p><div class="tw"><table class="lines"><tr><th>Service</th><th>Price (Rs.)</th><th></th></tr>${rows()}</table></div>
<button class="btn" style="margin-top:8px" onclick="db.svcList.push({id:uid(),name:'New service',price:0});svcListModal()">+ Add service</button>
<div class="mfoot"><button class="btn pri" onclick="log('Service price list changed','');save();closeModal();if(cur==='jobs')VIEWS.jobs()">Save &amp; close</button></div>`)}

/* ===================== Pre-orders ===================== */
let preTab='Pending';
function dueBadge(p){if(!['Pending','Arrived'].includes(p.status))return esc(p.promised);const d=daysBetween(today(),p.promised);
  const t=d<0?`OVERDUE ${-d}d`:d===0?'Due TODAY':d===1?'Due tomorrow':`in ${d} days`;return `${esc(p.promised)} <span class="pill ${d<=2?'red':'green'}">${t}</span>`}
VIEWS.preorders=function(){const list=db.preorders.filter(p=>p.status===preTab).sort((a,b)=>a.promised<b.promised?-1:1);
  main(`<div class="head"><h1>Pre-orders</h1><button class="btn pri" onclick="preModal()">+ New pre-order</button></div>
${tabs(['Pending','Arrived','Delivered','Cancelled'].map(s=>[s,`${s} (${db.preorders.filter(p=>p.status===s).length})`]),preTab,'setPreTab')}
<div class="card"><p class="muted small" style="margin-top:0">Red = promised date is within 2 days or already passed.</p>${tbl(['No','Promised','Customer','Vehicle','Part wanted','Qty','Advance','Ordered',''],list.map(p=>[esc(p.no),dueBadge(p),`${esc(p.cust.name)}<div class="muted small">${esc(p.cust.phone)}${p.cust.address?' · '+esc(p.cust.address):''}</div>`,esc([p.cust.mfr,p.cust.model].filter(Boolean).join(' ')),`${esc(p.partText)} ${p.g?gb(p.g):''}${p.note?`<div class="muted small">${esc(p.note)}</div>`:''}`,p.qty,money(p.advance),`${esc(p.orderDate)}<div class="muted small">by ${esc(p.by)}</div>`,
  p.status==='Pending'?`<button class="btn sm ok" onclick="preStatus('${p.id}','Arrived')">Arrived</button> <button class="btn sm" onclick="preModal('${p.id}')">Edit</button> <button class="btn sm bad" onclick="preStatus('${p.id}','Cancelled')">Cancel</button>`
  :p.status==='Arrived'?`<button class="btn sm ok" onclick="preDeliver('${p.id}')">Deliver &amp; bill →</button> <button class="btn sm" onclick="preModal('${p.id}')">Edit</button>`:p.inv?esc(p.inv):'']),[5,6])}</div>`)}
function setPreTab(t){preTab=t;VIEWS.preorders()}
function preModal(id,prefill){const p=id?JSON.parse(JSON.stringify(db.preorders.find(x=>x.id===id))):Object.assign({id:null,cust:blankCust(),pid:'',partText:'',g:'GEN',qty:1,advance:0,orderDate:today(),promised:dkey(Date.now()+3*DAY),note:'',status:'Pending'},prefill||{});
  window._pre=p;const pp=p.pid?partById(p.pid):null;
  modal(`<h2>${id?'Edit pre-order '+esc(p.no):'New pre-order'}</h2>${custFields('pr',true)}
<h2 style="margin-top:14px">Part</h2><div class="row"><div class="grow" style="flex:2 1 220px"><label>Our part (if it's in the list)</label><input id="pr_part" list="partdl" value="${pp?esc(partLabel(pp)):''}" placeholder="optional — search part no / name"></div><div style="width:130px"><label>Grade</label><select id="pr_g">${GR.map(g=>`<option value="${g.k}">${g.l}</option>`).join('')}</select></div><div style="width:80px"><label>Qty</label><input id="pr_q" type="number" min="1" value="${p.qty}"></div></div>
<label style="margin-top:8px">Part description *</label><input id="pr_txt" value="${esc(p.partText)}" placeholder="e.g. Engine guard for Pulsar 150">
<div class="row" style="margin-top:8px"><div class="grow"><label>Advance paid (Rs.)</label><input id="pr_adv" type="number" min="0" value="${p.advance}"></div><div class="grow"><label>Order date</label><input id="pr_od" type="date" value="${p.orderDate}"></div><div class="grow"><label>Promised date *</label><input id="pr_pd" type="date" value="${p.promised}"></div></div>
<label style="margin-top:8px">Note</label><input id="pr_note" value="${esc(p.note)}">
<div id="pr_err" class="low" style="margin-top:8px"></div><div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="savePre()">Save pre-order</button></div>`,true);
  custBind('pr',p.cust);$('#pr_g').value=p.g||'GEN';$('#pr_part').onchange=e=>{const x=partFromLabel(e.target.value);if(x&&!$('#pr_txt').value)$('#pr_txt').value=x.name+(x.models?' ('+x.models+')':'')}}
function savePre(){const p=window._pre;const err=m=>{$('#pr_err').textContent=m};const part=partFromLabel($('#pr_part').value);
  p.pid=part?part.id:'';p.partText=$('#pr_txt').value.trim()||(part?part.name:'');p.g=$('#pr_g').value;p.qty=Math.max(1,Math.floor(num($('#pr_q').value)));p.advance=r2(num($('#pr_adv').value));p.orderDate=$('#pr_od').value||today();p.promised=$('#pr_pd').value;p.note=$('#pr_note').value.trim();
  if(!p.cust.name.trim()||!p.cust.phone.trim())return err('Customer name and phone are required');if(!p.partText)return err('Describe the part');if(!p.promised)return err('Set the promised date');
  resolveCustomer(p.cust);
  if(!p.id){p.id=uid();p.no=seq('PRE');p.t=Date.now();p.by=me.name;db.preorders.push(p);log('Pre-order created',`${p.no} · ${p.cust.name} · ${p.partText} · promised ${p.promised}${p.advance?' · advance '+money(p.advance):''}`);if(p.fromMissing){const m=db.missing.find(x=>x.id===p.fromMissing);if(m)m.status='Pre-ordered'}}
  else{const ix=db.preorders.findIndex(x=>x.id===p.id);db.preorders[ix]=p;log('Pre-order edited',p.no)}
  flush();closeModal();toast('Pre-order saved');go(cur==='preorders'||cur==='missing'?cur:'preorders')}
function preStatus(id,s){const p=db.preorders.find(x=>x.id===id);if(s==='Cancelled'&&!confirm('Cancel this pre-order?'+(p.advance?`\nRemember to return the advance of ${money(p.advance)}.`:'')))return;p.status=s;log('Pre-order '+s,p.no+' · '+p.cust.name);save();go('preorders')}
function preDeliver(id){const p=db.preorders.find(x=>x.id===id);const pp=p.pid?partById(p.pid):null;
  if(!pp){if(confirm('This pre-order is not linked to a part in the inventory, so it cannot be billed automatically.\n\nMark it as delivered? (Bill it manually in the POS.)')){p.status='Delivered';p.doneT=Date.now();log('Pre-order Delivered',p.no);save();go('preorders')}return}
  if(num(pp.grades[p.g].qty)<p.qty)return toast(`Not enough stock of ${pp.name} (${GL(p.g)}). Receive the stock first.`);
  if(cart.length&&!confirm('Replace the items already in the POS bill?'))return;
  cart=[{type:'part',pid:pp.id,g:p.g,qty:p.qty,price:num(pp.grades[p.g].price),cost:num(pp.grades[p.g].cost),partNo:pp.partNo,name:pp.name}];
  ps=newPS();ps.cust=Object.assign(blankCust(),p.cust);ps.preId=p.id;ps.advance=p.advance;go('pos')}

/* ===================== Missing parts ===================== */
VIEWS.missing=function(){const list=db.missing.slice().sort((a,b)=>(a.status==='Open'?0:1)-(b.status==='Open'?0:1)||b.t-a.t);
  const grp={};db.missing.filter(m=>m.status==='Open').forEach(m=>{const k=(m.desc+'|'+m.mfr+'|'+m.model).toLowerCase();grp[k]=(grp[k]||0)+1});
  main(`<div class="head"><h1>Missing Parts</h1><button class="btn pri" onclick="missingModal()">+ Record missing part</button></div>
<p class="muted" style="margin-top:-6px">Parts customers asked for that we didn't have. Use this list when ordering from suppliers.</p>
<div class="card">${tbl(['Date','Part wanted','Manufacturer / model','Category','Customer','By','Status',''],list.map(m=>{const n=grp[(m.desc+'|'+m.mfr+'|'+m.model).toLowerCase()];return[fdt(m.t),`<b>${esc(m.desc)}</b>${n>1&&m.status==='Open'?` <span class="pill amber">asked ${n}×</span>`:''}${m.note?`<div class="muted small">${esc(m.note)}</div>`:''}`,esc([m.mfr,m.model].filter(Boolean).join(' ')),esc(m.cat),`${esc(m.cname)}<div class="muted small">${esc(m.cphone)}</div>`,esc(m.by),
  `<span class="pill ${m.status==='Open'?'amber':'green'}">${esc(m.status)}</span>`,m.status==='Open'?`<button class="btn sm" onclick="missToPre('${m.id}')">→ Pre-order</button>${isOwner()?` <button class="btn sm" onclick="missStatus('${m.id}','Ordered')">Ordered</button> <button class="btn sm bad" onclick="missStatus('${m.id}','Closed')">Close</button>`:''}`:'']}))}</div>`)}
function missingModal(pre){pre=pre||{};modal(`<h2>Customer wants a part we don't have</h2>
<label>Part wanted *</label><input id="ms_d" value="${esc(pre.desc||'')}" placeholder="e.g. Engine guard">
<div class="row" style="margin-top:8px"><div class="grow"><label>Manufacturer</label><input id="ms_m" list="mfrdl" value="${esc(pre.mfr||'')}"></div><div class="grow"><label>Model</label><input id="ms_md" list="modeldl" value="${esc(pre.model||'')}"></div><div class="grow"><label>Category</label><input id="ms_c" list="catdl" value="${esc(pre.cat||'')}"></div></div>
<div class="row" style="margin-top:8px"><div class="grow"><label>Customer name (optional)</label><input id="ms_cn" value="${esc(ps.cust.name)}"></div><div class="grow"><label>Phone (optional)</label><input id="ms_cp" value="${esc(ps.cust.phone)}"></div></div>
<label style="margin-top:8px">Note</label><input id="ms_n" placeholder="grade wanted, price customer expects…">
<div id="ms_err" class="low" style="margin-top:8px"></div><div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveMissing(true)">Save &amp; make pre-order</button><button class="btn pri" onclick="saveMissing(false)">Save</button></div>`)}
function saveMissing(toPre){const d=$('#ms_d').value.trim();if(!d)return $('#ms_err').textContent='Describe the part';
  const m={id:uid(),t:Date.now(),desc:d,mfr:$('#ms_m').value.trim(),model:$('#ms_md').value.trim(),cat:$('#ms_c').value.trim(),cname:$('#ms_cn').value.trim(),cphone:$('#ms_cp').value.trim(),note:$('#ms_n').value.trim(),by:me.name,status:'Open'};
  db.missing.push(m);log('Missing part recorded',`${d} · ${m.mfr} ${m.model}`);save();toast('Saved to Missing Parts list');closeModal();if(toPre)missToPre(m.id);else if(cur==='missing')VIEWS.missing()}
function missToPre(id){const m=db.missing.find(x=>x.id===id);preModal(null,{partText:m.desc+(m.model?' ('+[m.mfr,m.model].filter(Boolean).join(' ')+')':''),cust:Object.assign(blankCust(),{name:m.cname,phone:m.cphone,mfr:m.mfr,model:m.model}),note:m.note,fromMissing:m.id})}
function missStatus(id,s){const m=db.missing.find(x=>x.id===id);m.status=s;log('Missing part '+s,m.desc);save();VIEWS.missing()}

/* ===================== Inventory ===================== */
let invF={q:'',mfr:'',cat:'',low:false};
VIEWS.inventory=function(){main(`<div class="head"><h1>Inventory</h1>${can('stock')?`<div class="row"><button class="btn" onclick="importModal()">Import Excel (CSV)</button><button class="btn pri" onclick="partModal()">+ Add part</button></div>`:''}</div>
<div class="card"><div class="row"><div class="grow" style="flex:2 1 200px"><input id="iq" placeholder="Search part no, name, model, supplier no…" value="${esc(invF.q)}"></div><div class="grow"><select id="im"><option value="">All manufacturers</option>${mfrList().map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="grow"><select id="ic"><option value="">All categories</option>${catList().map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><label class="chk"><input type="checkbox" id="il" ${invF.low?'checked':''}> Low stock</label></div><div id="ilist" style="margin-top:12px"></div></div>`);
  $('#im').value=invF.mfr;$('#ic').value=invF.cat;$('#iq').oninput=e=>{invF.q=e.target.value;invList()};$('#im').onchange=e=>{invF.mfr=e.target.value;invList()};$('#ic').onchange=e=>{invF.cat=e.target.value;invList()};$('#il').onchange=e=>{invF.low=e.target.checked;invList()};invList()}
function invList(){const box=$('#ilist');if(!box)return;const st=can('stock'),sc=can('cost');
  let list=db.parts.filter(p=>matchText(p,invF.q)&&(!invF.mfr||p.manufacturer===invF.mfr)&&(!invF.cat||p.category===invF.cat)&&(!invF.low||GR.some(g=>isLow(p.grades[g.k]))));
  list.sort((a,b)=>a.partNo.localeCompare(b.partNo));const total=list.length;list=list.slice(0,300);
  const cell=gr=>!carried(gr)?'<span class="muted">—</span>':`<b class="${isLow(gr)?'low':''}">${num(gr.qty)}</b> <span class="muted">@ ${f2(gr.price)}</span>${sc?`<div class="muted small">cost ${f2(gr.cost)}</div>`:''}`;
  box.innerHTML=total?`<div class="muted small" style="margin-bottom:6px">${total} parts${total>300?' — showing first 300':''}</div><div class="tbl"><table><tr><th>Part No</th><th>Name / fits</th><th>Rack</th>${GR.map(g=>`<th>${gb(g.k)}</th>`).join('')}<th class="n">Total qty</th><th>Last change</th>${st?'<th></th>':''}</tr>${list.map(p=>`<tr><td><b>${esc(p.partNo)}</b></td><td>${esc(p.name)}<div class="muted small">${[p.manufacturer,p.models,p.category].filter(Boolean).map(esc).join(' · ')}</div></td><td>${esc(p.location)}</td>${GR.map(g=>`<td>${cell(p.grades[g.k])}</td>`).join('')}<td class="n"><b>${totalQty(p)}</b></td><td class="small">${p.updBy?esc(p.updBy)+'<div class="muted">'+fdt(p.updT)+'</div>':'<span class="muted">—</span>'}</td>${st?`<td style="white-space:nowrap"><button class="btn sm" onclick="stockModal('${p.id}')">Stock</button> <button class="btn sm" onclick="partModal('${p.id}')">Edit</button></td>`:''}</tr>`).join('')}</table></div>`
  :`<p class="muted">${db.parts.length?'No parts match.':'No parts yet.'}</p>`}
function touch(p){p.updBy=me.name;p.updT=Date.now()}
function partModal(id){if(!can('stock'))return;const p=id?partById(id):null;const g=k=>p?p.grades[k]:{};const sc=can('cost');window._supNos=JSON.parse(JSON.stringify(p?p.supNos||[]:[]));
  modal(`<h2>${p?'Edit part':'Add new part'}</h2>${p&&p.updBy?`<p class="muted small" style="margin-top:-8px">Last changed by <b>${esc(p.updBy)}</b> on ${fdt(p.updT)}</p>`:''}
<div class="row"><div style="width:170px"><label>Our part number *</label><input id="pp_no" value="${esc(p?.partNo)}"></div><div class="grow"><label>Part name *</label><input id="pp_name" value="${esc(p?.name)}" placeholder="e.g. Engine guard"></div></div>
<div class="row" style="margin-top:10px"><div class="grow"><label>Manufacturer *</label><input id="pp_mfr" list="mfrdl" value="${esc(p?.manufacturer)}" placeholder="Bajaj, Honda, TVS…"></div><div class="grow" style="flex:2 1 200px"><label>Fits models <span class="muted">(comma separated)</span></label><input id="pp_mod" value="${esc(p?.models)}" placeholder="e.g. CT100, Discover 125"></div></div>
<div class="row" style="margin-top:10px"><div class="grow"><label>Category *</label><input id="pp_cat" list="catdl" value="${esc(p?.category)}" placeholder="Engine head, Brakes…"></div><div style="width:160px"><label>Vehicle type</label><select id="pp_veh"><option>Motorcycle</option><option>Three-wheeler</option><option>Both</option></select></div><div style="width:110px"><label>Rack / bin</label><input id="pp_loc" value="${esc(p?.location)}"></div></div>
<h2 style="margin-top:16px">Grades &amp; prices</h2><p class="muted small" style="margin-top:-6px">Leave the selling price empty for a grade you don't sell.${sc?'':' Cost prices are hidden — only the owner (or staff the owner allows) can see them.'}</p>
<div class="tw"><table class="lines"><tr><th>Grade</th>${sc?'<th>Cost price</th>':''}<th>Selling price</th><th>${p?'Qty in stock':'Qty in stock now'}</th><th>Reorder at</th></tr>${GR.map(x=>`<tr><td>${gb(x.k)}</td>${sc?`<td><input id="pp_c_${x.k}" type="number" min="0" value="${esc(g(x.k).cost)}"></td>`:''}<td><input id="pp_p_${x.k}" type="number" min="0" value="${esc(g(x.k).price)}"></td><td>${p?`<b>${num(g(x.k).qty)}</b> <span class="muted small">(use Stock)</span>`:`<input id="pp_q_${x.k}" type="number" min="0" placeholder="0">`}</td><td><input id="pp_r_${x.k}" type="number" min="0" value="${esc(g(x.k).reorder)}" placeholder="${db.settings.defaultReorder}"></td></tr>`).join('')}</table></div>
${isOwner()?`<h2 style="margin-top:16px">Supplier part numbers</h2><p class="muted small" style="margin-top:-6px">Each supplier's own number for this part. When receiving stock, typing their number finds this part.</p><div id="pp_sn"></div>`:''}
<div id="pp_err" class="low" style="margin-top:8px"></div>
<div class="mfoot">${p&&isOwner()?`<button class="btn bad" style="margin-right:auto" onclick="delPart('${p.id}')">Delete</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="savePart('${id||''}')">Save</button></div>`,true);
  $('#pp_veh').value=p?.vehicle||'Motorcycle';if(isOwner())supNoRows()}
function supNoRows(){const L=window._supNos;$('#pp_sn').innerHTML=`${L.length?`<div class="tw"><table class="lines">${L.map((x,i)=>`<tr><td><select onchange="_supNos[${i}].supId=this.value"><option value="">— supplier —</option>${db.suppliers.map(s=>`<option value="${s.id}" ${s.id===x.supId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></td><td><input value="${esc(x.no)}" placeholder="their part no" onchange="_supNos[${i}].no=this.value.trim()"></td><td><button class="btn sm bad" onclick="_supNos.splice(${i},1);supNoRows()">✕</button></td></tr>`).join('')}</table></div>`:''}<button class="btn sm" onclick="_supNos.push({supId:'',no:''});supNoRows()">+ Add supplier number</button>`}
function savePart(id){const err=m=>{$('#pp_err').textContent=m};const no=$('#pp_no').value.trim(),name=$('#pp_name').value.trim(),mfr=$('#pp_mfr').value.trim(),cat=$('#pp_cat').value.trim();
  if(!no||!name||!mfr||!cat)return err('Part number, name, manufacturer and category are required');
  if(db.parts.some(x=>x.partNo.toLowerCase()===no.toLowerCase()&&x.id!==id))return err('Another part already has this part number');
  let p=id?partById(id):null;const sc=can('cost');const grades={};
  for(const g of GR){const pr=$('#pp_p_'+g.k).value,re=$('#pp_r_'+g.k).value;const old=p?p.grades[g.k]:{cost:'',qty:0};const co=sc?$('#pp_c_'+g.k).value:old.cost;
    grades[g.k]={cost:co===''?'':num(co),price:pr===''?'':num(pr),reorder:re===''?'':num(re),qty:num(old.qty)}}
  const fields={partNo:no,name,manufacturer:mfr,category:cat,vehicle:$('#pp_veh').value,models:$('#pp_mod').value.trim(),location:$('#pp_loc').value.trim()};
  if(isOwner())fields.supNos=window._supNos.filter(x=>x.supId&&x.no);
  if(p){const ch=[];GR.forEach(g=>{if(num(p.grades[g.k].price)!==num(grades[g.k].price))ch.push(`${g.l} price ${f2(p.grades[g.k].price)}→${f2(grades[g.k].price)}`);if(sc&&num(p.grades[g.k].cost)!==num(grades[g.k].cost))ch.push(`${g.l} cost ${f2(p.grades[g.k].cost)}→${f2(grades[g.k].cost)}`)});
    Object.assign(p,fields,{grades});touch(p);log('Part edited',no+(ch.length?' · '+ch.join(', '):''))}
  else{p=Object.assign({id:uid(),created:Date.now(),supNos:[]},fields,{grades});GR.forEach(g=>{const q=Math.max(0,Math.floor(num($('#pp_q_'+g.k).value)));grades[g.k].qty=q;if(q)db.moves.push({t:Date.now(),pid:p.id,g:g.k,qty:q,why:'Stock when part added',u:me.name})});touch(p);db.parts.push(p);log('Part added',no+' '+name)}
  save();closeModal();toast('Saved');refreshDL();invList();if(window._afterPart){const f=window._afterPart;window._afterPart=null;f(p)}}
function delPart(id){const p=partById(id);if(!confirm(`Delete ${p.partNo} ${p.name}? Old bills still keep its name.`))return;db.parts=db.parts.filter(x=>x.id!==id);log('Part deleted',p.partNo+' '+p.name);save();closeModal();invList()}
function stockModal(id){const p=partById(id);
  modal(`<h2>Stock — ${esc(p.partNo)} ${esc(p.name)}</h2><p>${GR.map(g=>`${gb(g.k)} <b>${num(p.grades[g.k].qty)}</b>`).join(' &nbsp; ')} &nbsp; Total <b>${totalQty(p)}</b></p>
<div class="row"><div style="width:150px"><label>Grade</label><select id="sm_g">${GR.map(g=>`<option value="${g.k}">${g.l}</option>`).join('')}</select></div><div class="grow"><label>Action</label><select id="sm_t"><option value="in">Stock IN — received</option><option value="out">Stock OUT — damaged / lost</option><option value="set">Set exact count — after checking</option></select></div><div style="width:100px"><label>Quantity</label><input id="sm_q" type="number" min="0"></div></div>
<label style="margin-top:8px">Reason / note</label><input id="sm_n"><p class="muted small">Tip: stock from suppliers should be entered in <b>Suppliers → Receive stock</b> so the bill is recorded too.</p>
<div id="sm_err" class="low"></div><div class="mfoot"><button class="btn" onclick="closeModal()">Close</button><button class="btn pri" onclick="doStock('${id}')">Apply</button></div>
<h2>Recent movements</h2>${tbl(['Date','Grade','Qty','Reason','By'],db.moves.filter(m=>m.pid===id).slice(-15).reverse().map(m=>[fdt(m.t),gb(m.g),(m.qty>0?'+':'')+m.qty,esc(m.why),esc(m.u)]),[2])}`,true)}
function doStock(id){const p=partById(id),g=$('#sm_g').value,t=$('#sm_t').value,raw=$('#sm_q').value,q=Math.floor(num(raw)),note=$('#sm_n').value.trim();const gr=p.grades[g];const err=m=>{$('#sm_err').textContent=m};
  if(raw===''||q<0||(t!=='set'&&q===0))return err('Enter a quantity');const delta=t==='in'?q:t==='out'?-q:q-num(gr.qty);if(num(gr.qty)+delta<0)return err('Stock cannot go below zero');
  gr.qty=num(gr.qty)+delta;touch(p);const why={in:'Stock in',out:'Stock out',set:'Stock count'}[t]+(note?' — '+note:'');db.moves.push({t:Date.now(),pid:id,g,qty:delta,why,u:me.name});
  log('Stock '+t.toUpperCase(),`${p.partNo} ${GL(g)} ${delta>0?'+':''}${delta} (${why})`);save();toast('Stock updated');stockModal(id);invList()}
const CSVH=['part_no','name','manufacturer','models','category','vehicle','location','genuine_cost','genuine_price','genuine_qty','aa_cost','aa_price','aa_qty','a_cost','a_price','a_qty'];
const GKEY={GEN:'genuine',AA:'aa',A:'a'};
function dlTemplate(){download('parts-template.csv',toCSV([CSVH,['BR-001','Brake shoe rear','Bajaj','CT100, Discover 125','Brakes','Motorcycle','A1',850,1200,10,450,700,15,300,500,20]]),'text/csv')}
function importModal(){modal(`<h2>Import parts from Excel</h2><ol style="line-height:1.8;padding-left:20px"><li>Download the template and open it in Excel.</li><li>One row per part. Leave price empty for grades you don't sell.</li><li>Excel: <b>File → Save As → CSV (Comma delimited)</b>.</li><li>Choose the file below.</li></ol><p class="muted">Existing part numbers are updated and quantities are <b>added</b> to stock.</p>
<button class="btn" onclick="dlTemplate()">⬇ Download template</button><div style="margin-top:12px"><input type="file" id="im_f" accept=".csv,text/csv"></div><div id="im_out" style="margin-top:10px"></div><div class="mfoot"><button class="btn" onclick="closeModal()">Close</button></div>`);
  $('#im_f').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f)}}
function doImport(text){const out=$('#im_out');const rows=parseCSV(text.replace(/^﻿/,''));if(rows.length<2){out.innerHTML='<p class="low">No data rows.</p>';return}
  const h=rows[0].map(x=>x.trim().toLowerCase().replace(/\s+/g,'_'));const ix=k=>h.indexOf(k);if(ix('part_no')<0||ix('name')<0){out.innerHTML='<p class="low">Columns part_no and name are required.</p>';return}
  const VM={'motorcycle':'Motorcycle','bike':'Motorcycle','three-wheeler':'Three-wheeler','three wheeler':'Three-wheeler','threewheeler':'Three-wheeler','both':'Both'};const sc=can('cost');let add=0,upd=0,skip=0;
  rows.slice(1).forEach(r=>{const v=k=>ix(k)<0?'':String(r[ix(k)]??'').trim();const no=v('part_no'),name=v('name');if(!no||!name){skip++;return}
    let p=db.parts.find(x=>x.partNo.toLowerCase()===no.toLowerCase());const isNew=!p;
    if(!p){p={id:uid(),created:Date.now(),partNo:no,name,manufacturer:'',category:'',vehicle:'Motorcycle',models:'',location:'',supNos:[],grades:emptyGrades()};db.parts.push(p)}
    p.name=name;['manufacturer','models','category','location'].forEach(k=>{if(v(k))p[k]=v(k)});if(v('vehicle'))p.vehicle=VM[v('vehicle').toLowerCase()]||p.vehicle;
    GR.forEach(g=>{const pre=GKEY[g.k],gr=p.grades[g.k];if(sc&&v(pre+'_cost')!=='')gr.cost=nn(v(pre+'_cost'));if(v(pre+'_price')!=='')gr.price=nn(v(pre+'_price'));const q=Math.floor(nn(v(pre+'_qty')));if(q>0){gr.qty=num(gr.qty)+q;db.moves.push({t:Date.now(),pid:p.id,g:g.k,qty:q,why:'Excel import',u:me.name})}});
    touch(p);isNew?add++:upd++});
  log('Excel import',`${add} added, ${upd} updated`);flush();out.innerHTML=`<div class="alert">Done: <b>${add}</b> new, <b>${upd}</b> updated${skip?`, ${skip} skipped`:''}.</div>`;invList()}

/* ===================== Customers ===================== */
VIEWS.customers=function(){main(`<div class="head"><h1>Customers &amp; Credit</h1><button class="btn pri" onclick="custModal()">+ Add customer</button></div><div class="card"><div class="row"><div class="grow"><input id="cq" placeholder="Search name, phone or vehicle no…"></div><label class="chk"><input type="checkbox" id="cowe"> Owes money only</label></div><div id="clist" style="margin-top:12px"></div></div>`);$('#cq').oninput=custList;$('#cowe').onchange=custList;custList()}
function custList(){const box=$('#clist');if(!box)return;const q=($('#cq').value||'').toLowerCase(),owe=$('#cowe').checked;
  const last={},cnt={};db.sales.forEach(s=>{if(s.void||!s.customerId)return;cnt[s.customerId]=(cnt[s.customerId]||0)+1;last[s.customerId]=Math.max(last[s.customerId]||0,s.t)});
  const list=db.customers.filter(c=>(c.name+' '+c.phone+' '+(c.vehicleNo||'')).toLowerCase().includes(q)).map(c=>({c,b:custBal(c.id)})).filter(x=>!owe||x.b>0).sort((a,b)=>b.b-a.b||(last[b.c.id]||0)-(last[a.c.id]||0));
  box.innerHTML=`<div class="muted small" style="margin-bottom:6px">${list.length} customers · total owed <b class="low">${money(sum(list,x=>Math.max(0,x.b)))}</b></div>`+tbl(['Name','Phone','Vehicle','Bills','Last visit','Owes',''],list.slice(0,300).map(({c,b})=>[`<b>${esc(c.name)}</b>`,esc(c.phone),`${esc(c.vehicleNo)}<div class="muted small">${esc([c.mfr,c.model].filter(Boolean).join(' '))}</div>`,cnt[c.id]||0,last[c.id]?dkey(last[c.id]):'—',`<span class="${b>0?'low':''}">${money(b)}</span>`,
  `<button class="btn sm" onclick="custHistory('${c.id}')">History</button> ${b>0?`<button class="btn sm ok" onclick="payModal('${c.id}')">Receive</button> `:''}<button class="btn sm" onclick="custModal('${c.id}')">Edit</button>`]),[3,5])}
function custModal(id){const c=id?custById(id):{};modal(`<h2>${id?'Edit':'Add'} customer</h2><div class="row"><div class="grow"><label>Name *</label><input id="cu_n" value="${esc(c.name)}"></div><div style="width:160px"><label>Phone *</label><input id="cu_p" value="${esc(c.phone)}" inputmode="tel"></div></div>
<div class="row" style="margin-top:10px"><div class="grow"><label>Vehicle no</label><input id="cu_v" value="${esc(c.vehicleNo)}"></div><div class="grow"><label>Manufacturer</label><input id="cu_m" list="mfrdl" value="${esc(c.mfr)}"></div><div class="grow"><label>Model</label><input id="cu_md" list="modeldl" value="${esc(c.model)}"></div></div>
<div class="row" style="margin-top:10px"><div class="grow"><label>NIC no (optional)</label><input id="cu_nic" value="${esc(c.nic)}"></div><div class="grow" style="flex:2 1 200px"><label>Address</label><input id="cu_a" value="${esc(c.address)}"></div></div>
<div class="row" style="margin-top:10px"><div style="width:240px"><label>Credit limit Rs. (0 = none)${isOwner()?'':' — owner only'}</label><input id="cu_l" type="number" min="0" value="${esc(c.limit||0)}" ${isOwner()?'':'disabled'}></div></div>
<div id="cu_err" class="low" style="margin-top:8px"></div><div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveCust('${id||''}')">Save</button></div>`)}
function saveCust(id){const n=$('#cu_n').value.trim(),ph=$('#cu_p').value.trim();if(!n||!ph)return $('#cu_err').textContent='Name and phone are required';
  if(db.customers.some(x=>x.id!==id&&x.phone&&x.phone.replace(/\D/g,'')===ph.replace(/\D/g,'')))return $('#cu_err').textContent='Another customer already has this phone number';
  let c=id?custById(id):null;const f={name:n,phone:ph,vehicleNo:$('#cu_v').value.trim(),mfr:$('#cu_m').value.trim(),model:$('#cu_md').value.trim(),nic:$('#cu_nic').value.trim(),address:$('#cu_a').value.trim()};if(isOwner())f.limit=num($('#cu_l').value);

function doVoid(id){const s=db.sales.find(x=>x.id===id);const r=$('#vd_r').value.trim();const err=m=>{$('#vd_err').textContent=m};if(!r)return err('Enter a reason');

function chequesDue(days){const t=today(),end=dkey(Date.now()+days*DAY);const L=[];
  db.grns.forEach(g=>{if(g.paid>0&&g.method==='Cheque'&&g.chqDate)L.push({date:g.chqDate,amount:g.paid,sup:supById(g.supId),ref:g.no,chq:g.chqNo})});
  db.supPays.forEach(p=>{if(p.method==='Cheque'&&p.chqDate)L.push({date:p.chqDate,amount:p.amount,sup:supById(p.supId),ref:p.no,chq:p.chqNo})});
  return L.filter(x=>x.date>=t&&x.date<=end).sort((a,b)=>a.date<b.date?-1:1)}
function supBills(id){let pool=sum(db.supPays.filter(p=>p.supId===id),p=>p.amount)+sum(db.supReturns.filter(r=>r.supId===id),r=>r.total);
  return db.grns.filter(g=>g.supId===id).sort((a,b)=>a.billDate<b.billDate?-1:1).map(g=>{const owed=r2(g.total-g.paid);const a=Math.min(pool,owed);pool-=a;return Object.assign({},g,{rem:r2(owed-a)})})}

  main(`<div class="head"><h1>Suppliers</h1><div class="row"><button class="btn" onclick="comparePrices()">Compare prices</button><button class="btn" onclick="orderModal()">Make order</button><button class="btn" onclick="supModal()">+ Supplier</button><button class="btn pri" onclick="newGRN()">⬇ Receive stock (GRN)</button></div></div>

<div class="card"><h2>Unpaid bills</h2>${tbl(['Due','Supplier','GRN','Their bill no','Bill date','Total','Still owed'],allBills.sort((a,b)=>a.dueDate<b.dueDate?-1:1).map(b=>[`${b.dueDate} ${b.dueDate<t?'<span class="pill red">overdue</span>':b.dueDate<=dkey(Date.now()+7*DAY)?'<span class="pill amber">soon</span>':''}`,esc(supById(b.supId)?.name),esc(b.no),esc(b.billNo),b.billDate,money(b.total),money(b.rem)]),[5,6])}</div>

function doSupReturn(id){const err=m=>{$('#sr_err').textContent=m};const p=partFromLabel($('#sr_p').value),g=$('#sr_g').value,q=Math.floor(num($('#sr_q').value)),c=num($('#sr_c').value),r=$('#sr_r').value.trim();

function paySalary(id){const r=payrollRows(payMonth).find(x=>x.u.id===id);if(!confirm(`Pay ${r.u.name} ${money(r.net)} for ${payMonth}?`))return;
  const slip={id:uid(),t:Date.now(),month:payMonth,staffId:id,name:r.u.name,role:r.u.role,profit:r.x.profit,salary:r.salary,comm:r.comm,commPct:num(r.u.commPct),bonus:r.bonus,adv:r.adv,net:r.net,by:me.name};
  db.payslips.push(slip);log('Salary paid',`${r.u.name} · ${payMonth} · ${money(r.net)}`);flush();payroll();printSlip(slip.id)}
function printSlip(id){const s=db.payslips.find(x=>x.id===id);const tr=(a,b,c)=>`<tr${c?` class="${c}"`:''}><td>${a}</td><td class="r">${b}</td></tr>`;
  const h=`<div class="rcpt" style="width:${rWidth()}">${rHead()}<div class="c bigt">PAY SLIP</div><div class="c">${esc(s.month)}</div><hr><table>${tr('Name',esc(s.name))}${tr('Role',ROLES[s.role])}${tr('Paid on',dkey(s.t))}</table><hr><table>${tr('Basic salary',f2(s.salary))}${tr(`Commission ${s.commPct}%`,f2(s.comm))}${s.bonus?tr('Target bonus',f2(s.bonus)):''}${s.adv?tr('Less advances','-'+f2(s.adv)):''}${tr('NET PAY',f2(s.net),'bigt')}</table><hr><br>Signature: ..........................<br>&nbsp;</div>`;
  modal(`<h2>Pay slip</h2><div class="rcpt-prev">${h}</div><div class="mfoot"><button class="btn" onclick="closeModal()">Close</button><button class="btn pri" id="rp">🖨 Print</button></div>`);$('#rp').onclick=()=>printHTML(h)}

/* ===================== Reports (owner) ===================== */
let rpF=null,repTab='overview';
VIEWS.reports=function(){if(!rpF){const d=new Date();rpF={from:dkey(new Date(d.getFullYear(),d.getMonth(),1)),to:today()}}
  main(`<h1>Reports</h1><div class="card"><div class="row"><div><label>From</label><input type="date" id="rf" value="${rpF.from}"></div><div><label>To</label><input type="date" id="rt" value="${rpF.to}"></div><button class="btn" onclick="rpQuick(1)">Today</button><button class="btn" onclick="rpQuick(7)">7 days</button><button class="btn" onclick="rpQuick(30)">30 days</button><button class="btn" onclick="rpQuick('m')">This month</button></div></div>
${tabs([['overview','Overview'],['staff','Staff & mechanics'],['services','Services'],['discounts','Discounts'],['stock','Stock analysis'],['value','Stock value'],['order','To order']],repTab,'setRepTab')}<div id="rbody"></div>`);
  $('#rf').onchange=$('#rt').onchange=()=>{rpF={from:$('#rf').value,to:$('#rt').value};repBody()};repBody()}
function setRepTab(t){repTab=t;VIEWS.reports()}
function rpQuick(k){const d=new Date();rpF={to:today(),from:k==='m'?dkey(new Date(d.getFullYear(),d.getMonth(),1)):dkey(Date.now()-(k-1)*DAY)};VIEWS.reports()}
function inRange(t){const d=dkey(t);return(!rpF.from||d>=rpF.from)&&(!rpF.to||d<=rpF.to)}
function barChart(rows){if(!rows.length)return '<p class="muted">No data.</p>';const W=Math.max(640,rows.length*24+70),H=250,L=56,B=30,T=12;const max=Math.max(1,...rows.map(r=>Math.max(r.a,r.b)));const bw=(W-L-10)/rows.length;const y=v=>T+(H-T-B)*(1-Math.max(0,v)/max);
  let s=`<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${Math.min(W,560)}px;height:auto;display:block" font-size="11" font-family="Segoe UI,Arial">`;
  for(let i=0;i<=4;i++){const v=max*i/4;s+=`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#e6e9ee"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" fill="#6b7785">${short(v)}</text>`}
  const every=Math.ceil(rows.length/14);rows.forEach((r,i)=>{const x=L+i*bw,w=Math.max(2,bw*0.38);
    s+=`<rect x="${x+bw*0.1}" y="${y(r.a)}" width="${w}" height="${H-B-y(r.a)}" fill="#3b74d1" rx="2"><title>${r.label} sales ${money(r.a)}</title></rect><rect x="${x+bw*0.1+w+1}" y="${y(r.b)}" width="${w}" height="${H-B-y(r.b)}" fill="#2e9e5b" rx="2"><title>${r.label} profit ${money(r.b)}</title></rect>`;
    if(i%every===0)s+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" fill="#6b7785">${r.label.slice(5)}</text>`});
  return s+`</svg></div><div class="small muted" style="margin-top:4px"><span style="display:inline-block;width:10px;height:10px;background:#3b74d1;border-radius:2px"></span> Sales &nbsp; <span style="display:inline-block;width:10px;height:10px;background:#2e9e5b;border-radius:2px"></span> Profit — hover / tap a bar for the amount</div>`}
function repBody(){const S=db.sales.filter(s=>!s.void&&inRange(s.t)),box=$('#rbody');
  if(repTab==='overview'){const V=db.sales.filter(s=>s.void&&inRange(s.t)),P=db.payments.filter(p=>inRange(p.t));const D=S.filter(s=>s.disc>0);
    const byPay={};S.forEach(s=>{const o=byPay[s.pay]=byPay[s.pay]||{n:0,t:0,cr:0};o.n++;o.t+=s.total;if(s.pay==='Credit')o.cr+=s.total-s.paid});
    const byG={};S.forEach(s=>s.items.forEach(i=>{const g=byG[i.g]=byG[i.g]||{q:0,s:0,c:0};g.q+=i.qty;g.s+=i.qty*i.price;g.c+=i.qty*i.cost}));
    const days=[];const byD={};S.forEach(s=>{const d=byD[dkey(s.t)]=byD[dkey(s.t)]||{n:0,t:0,p:0,q:0};d.n++;d.t+=s.total;d.p+=saleProfit(s);d.q+=sum(s.items,i=>i.qty)});
    let a=new Date((rpF.from||dkey(Math.min(...db.sales.map(s=>s.t),Date.now())))+'T00:00'),b=new Date((rpF.to||today())+'T00:00');for(let n=0;a<=b&&n<120;n++,a=new Date(a.getTime()+DAY+3600e3)){a.setHours(0);const k=dkey(a);days.push({label:k,a:byD[k]?byD[k].t:0,b:byD[k]?byD[k].p:0})}
    const top={};S.forEach(s=>s.items.forEach(i=>{const k=i.pid+i.g;const o=top[k]=top[k]||{no:i.partNo,name:i.name,g:i.g,q:0,s:0};o.q+=i.qty;o.s+=i.qty*i.price}));
    const tSub=sum(S,s=>s.sub);
    box.innerHTML=`<div class="stats"><div class="stat"><div class="l">Total sales</div><div class="v">${money(sum(S,s=>s.total))}</div><div class="muted">${S.length} bills${V.length?` · ${V.length} voided`:''}</div></div>
<div class="stat"><div class="l">Gross profit</div><div class="v" style="color:var(--ok)">${money(sum(S,saleProfit))}</div><div class="muted">cost of parts ${money(sum(S,saleCost))}</div></div>
<div class="stat"><div class="l">Parts sold</div><div class="v">${sum(S,s=>sum(s.items,i=>i.qty))}</div><div class="muted">${sum(S,s=>s.services.length)} services</div></div>
<div class="stat"><div class="l">Discounts given</div><div class="v">${money(sum(S,s=>s.disc))}</div><div class="muted">${D.length} bills · avg ${tSub?(sum(S,s=>s.disc)/tSub*100).toFixed(1):0}% overall</div></div>
<div class="stat"><div class="l">Credit collected</div><div class="v">${money(sum(P,p=>p.amount))}</div></div></div>
<div class="card"><h2>Day by day</h2>${barChart(days)}<details style="margin-top:10px"><summary class="linkbtn">Show the numbers</summary>${tbl(['Date','Bills','Parts','Sales','Profit'],Object.entries(byD).sort((x,y)=>x[0]<y[0]?1:-1).map(([d,o])=>[d,o.n,o.q,money(o.t),money(o.p)]),[1,2,3,4])}</details></div>
<div class="row" style="align-items:stretch"><div class="card grow" style="flex:1 1 300px"><h2>By payment type</h2>${tbl(['Type','Bills','Amount','Still on credit'],Object.entries(byPay).map(([k,o])=>[k,o.n,money(o.t),k==='Credit'?money(o.cr):'']),[1,2,3])}</div>
<div class="card grow" style="flex:1 1 300px"><h2>By grade</h2>${tbl(['Grade','Qty','Sales','Profit'],GR.filter(g=>byG[g.k]).map(g=>{const o=byG[g.k];return[gb(g.k),o.q,money(o.s),money(o.s-o.c)]}),[1,2,3])}</div></div>
<div class="card"><h2>Top 15 parts</h2>${tbl(['Part No','Name','Grade','Qty','Sales'],Object.values(top).sort((x,y)=>y.q-x.q).slice(0,15).map(p=>[esc(p.no),esc(p.name),gb(p.g),p.q,money(p.s)]),[3,4])}</div>
<div class="card"><button class="btn" onclick="dlSales()">⬇ Download sales for this period (Excel CSV)</button></div>`}
  else if(repTab==='staff'){const st=staffStats(rpF.from||'0000',rpF.to||'9999');
    box.innerHTML=`<div class="card"><h2>Staff &amp; mechanics</h2>${tbl(['Name','Role','Bills made','Jobs done','Parts sold','Services','Sales','Discount given','Profit','Comm %','Commission'],Object.values(st).filter(x=>x.bills||x.jobs).map(x=>{const c=commOf(x.u,x.profit);return[esc(x.u.name),ROLES[x.u.role],x.bills,x.jobs,x.parts,x.svcs,money(x.sales),money(x.disc),money(x.profit),num(x.u.commPct)+'%',money(c.comm)]}),[2,3,4,5,6,7,8,10])}
<p class="muted small">Commission here is for the selected dates. Target bonuses are worked out per month in Staff &amp; Payroll.</p></div>`}
  else if(repTab==='services'){const J=S.filter(s=>s.services.length);const bySvc={},byM={};J.forEach(s=>{s.services.forEach(v=>{const o=bySvc[v.name]=bySvc[v.name]||{n:0,t:0};o.n+=v.qty;o.t+=v.qty*v.price});const m=s.mechName||'—';const o=byM[m]=byM[m]||{n:0,t:0,p:0};o.n++;o.t+=s.total;o.p+=saleProfit(s)});
    box.innerHTML=`<div class="stats"><div class="stat"><div class="l">Service bills</div><div class="v">${J.length}</div></div><div class="stat"><div class="l">Service charges</div><div class="v">${money(sum(J,s=>sum(s.services,v=>v.qty*v.price)))}</div></div><div class="stat"><div class="l">Open jobs now</div><div class="v">${db.jobs.filter(j=>j.status==='open').length}</div></div></div>
<div class="row" style="align-items:stretch"><div class="card grow" style="flex:1 1 300px"><h2>By service type</h2>${tbl(['Service','Times','Amount'],Object.entries(bySvc).sort((a,b)=>b[1].n-a[1].n).map(([k,o])=>[esc(k),o.n,money(o.t)]),[1,2])}</div><div class="card grow" style="flex:1 1 300px"><h2>By mechanic</h2>${tbl(['Mechanic','Jobs','Bill total','Profit'],Object.entries(byM).map(([k,o])=>[esc(k),o.n,money(o.t),money(o.p)]),[1,2,3])}</div></div>
<div class="card"><h2>Service history</h2>${tbl(['Bill','Date','Customer','Vehicle','Mechanic','Services','Total'],J.slice().reverse().slice(0,300).map(s=>[esc(s.inv),fdt(s.t),esc(s.cname),esc(s.vehicleNo),esc(s.mechName),esc(s.services.map(v=>v.name).join(', ')),money(s.total)]),[6])}</div>`}
  else if(repTab==='discounts'){const D=S.filter(s=>s.disc>0);const byU={};D.forEach(s=>{const o=byU[s.uname]=byU[s.uname]||{n:0,d:0,auto:0};o.n++;o.d+=s.disc;if(s.auto)o.auto++});
    box.innerHTML=`<div class="stats"><div class="stat"><div class="l">Discounted bills</div><div class="v">${D.length}</div><div class="muted">of ${S.length} bills (${S.length?Math.round(D.length/S.length*100):0}%)</div></div><div class="stat"><div class="l">Total discount</div><div class="v">${money(sum(D,s=>s.disc))}</div></div><div class="stat"><div class="l">Automatic (big bill)</div><div class="v">${D.filter(s=>s.auto).length}</div></div><div class="stat"><div class="l">Given by staff</div><div class="v">${D.filter(s=>!s.auto).length}</div></div></div>
<div class="card"><h2>By staff member</h2>${tbl(['Staff','Bills','Automatic','Manual','Total discount'],Object.entries(byU).map(([k,o])=>[esc(k),o.n,o.auto,o.n-o.auto,money(o.d)]),[1,2,3,4])}</div>
<div class="card"><h2>Discounted bills history</h2>${tbl(['Invoice','Date','Billed by','Customer','Before discount','Discount','Type','Total',''],D.slice().reverse().map(s=>[esc(s.inv),fdt(s.t),esc(s.uname),esc(s.cname),money(s.sub),`${s.pct}% = ${money(s.disc)}`,s.auto?'<span class="pill blue">auto</span>':'<span class="pill amber">manual</span>',money(s.total),`<button class="btn sm" onclick="viewSale('${s.id}')">View</button>`]),[4,7])}</div>`}
  else if(repTab==='stock'){const now=Date.now();const s30={},s90={};db.sales.filter(s=>!s.void&&s.t>now-90*DAY).forEach(s=>s.items.forEach(i=>{const k=i.pid+'|'+i.g;s90[k]=(s90[k]||0)+i.qty;if(s.t>now-30*DAY)s30[k]=(s30[k]||0)+i.qty}));
    const mf=window._saM||'',gf=window._saG||'',sf=window._saS||'';const rows=[];
    db.parts.forEach(p=>{if(mf&&p.manufacturer!==mf)return;GR.forEach(g=>{if(gf&&g.k!==gf)return;const gr=p.grades[g.k];if(!carried(gr))return;const k=p.id+'|'+g.k,a=s30[k]||0,b=s90[k]||0,q=num(gr.qty);const perDay=b/90;const cover=perDay?Math.round(q/perDay):Infinity;
      let st,c,o;if(q<=reorderOf(gr)){st='Reorder now';c='red';o=0}else if(cover<21){st='Fast — keep more';c='amber';o=1}else if(b===0){st='Not selling';c='red';o=3}else if(cover>120){st='Overstocked';c='blue';o=2}else{st='OK';c='green';o=4}
      if(sf&&st!==sf)return;rows.push({o,r:[esc(p.partNo),esc(p.name),esc(p.manufacturer),gb(g.k),q,a,b,cover===Infinity?'—':cover+' days',`<span class="pill ${c}">${st}</span>`]})})});
    rows.sort((x,y)=>x.o-y.o);
    box.innerHTML=`<div class="card"><h2>Which parts to stock more of, and which are overstocked</h2><p class="muted small" style="margin-top:-6px">Based on the last 90 days of sales. “Days of stock” = how long current stock will last at the current selling speed.</p>
<div class="row" style="margin-bottom:10px"><div class="grow"><select onchange="window._saM=this.value;repBody()"><option value="">All manufacturers</option>${mfrList().map(x=>`<option ${x===mf?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="grow"><select onchange="window._saG=this.value;repBody()"><option value="">All grades</option>${GR.map(g=>`<option value="${g.k}" ${g.k===gf?'selected':''}>${g.l}</option>`).join('')}</select></div><div class="grow"><select onchange="window._saS=this.value;repBody()"><option value="">All statuses</option>${['Reorder now','Fast — keep more','Overstocked','Not selling','OK'].map(x=>`<option ${x===sf?'selected':''}>${x}</option>`).join('')}</select></div></div>
<div class="tbl">${tbl(['Part No','Name','Manufacturer','Grade','In stock','Sold 30d','Sold 90d','Days of stock','Advice'],rows.map(x=>x.r),[4,5,6,7])}</div></div>`}
  else if(repTab==='value'){const mf=window._svM||'';const by={};db.parts.forEach(p=>{if(mf&&p.manufacturer!==mf)return;GR.forEach(g=>{const gr=p.grades[g.k];const q=Math.max(0,num(gr.qty));if(!q)return;const k=(p.manufacturer||'—')+'|'+g.k;const o=by[k]=by[k]||{m:p.manufacturer||'—',g:g.k,q:0,c:0,r:0};o.q+=q;o.c+=q*num(gr.cost);o.r+=q*num(gr.price)})});
    const R=Object.values(by).sort((a,b)=>a.m.localeCompare(b.m)||GR.findIndex(g=>g.k===a.g)-GR.findIndex(g=>g.k===b.g));
    box.innerHTML=`<div class="card"><div class="head"><h2 style="margin:0">Current stock value</h2><select style="width:auto" onchange="window._svM=this.value;repBody()"><option value="">All manufacturers</option>${mfrList().map(x=>`<option ${x===mf?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
<div class="stats"><div class="stat"><div class="l">Items in stock</div><div class="v">${sum(R,x=>x.q)}</div></div><div class="stat"><div class="l">Value at cost</div><div class="v">${money(sum(R,x=>x.c))}</div></div><div class="stat"><div class="l">Value at selling price</div><div class="v">${money(sum(R,x=>x.r))}</div></div><div class="stat"><div class="l">Possible profit</div><div class="v" style="color:var(--ok)">${money(sum(R,x=>x.r-x.c))}</div></div></div>
${tbl(['Manufacturer','Grade','Qty','At cost','At selling price'],R.map(x=>[esc(x.m),gb(x.g),x.q,money(x.c),money(x.r)]),[2,3,4])}</div>`}
  else if(repTab==='order'){const low=lowStock(),miss=db.missing.filter(m=>m.status==='Open'),pre=db.preorders.filter(p=>p.status==='Pending');
    box.innerHTML=`<div class="card"><div class="head"><h2 style="margin:0">Low stock</h2><button class="btn sm" onclick="orderModal()">Make order →</button></div>${tbl(['Part No','Name','Manufacturer','Grade','In stock','Reorder at'],low.map(x=>[esc(x.p.partNo),esc(x.p.name),esc(x.p.manufacturer),gb(x.g),x.gr.qty,reorderOf(x.gr)]),[4,5])}</div>
<div class="card"><h2>Missing parts customers asked for</h2>${tbl(['Date','Part','Manufacturer / model','Customer'],miss.map(m=>[dkey(m.t),esc(m.desc),esc([m.mfr,m.model].filter(Boolean).join(' ')),esc(m.cname)]))}</div>
<div class="card"><h2>Pre-orders still to get</h2>${tbl(['Promised','Customer','Part','Qty'],pre.map(p=>[dueBadge(p),esc(p.cust.name),esc(p.partText),p.qty]),[3])}</div>`}}
function dlSales(){const S=db.sales.filter(s=>inRange(s.t));const rows=[['Invoice','Date','Billed by','Mechanic','Customer','Vehicle','Payment','Status','Item','Grade','Qty','Price','Line total','Line cost','Disc %','Bill discount','Bill total']];
  S.forEach(s=>{const L=[...s.items.map(i=>[i.partNo+' '+i.name,GL(i.g),i.qty,i.price,r2(i.qty*i.price),r2(i.qty*i.cost)]),...s.services.map(v=>[v.name,'Service',v.qty,v.price,r2(v.qty*v.price),0])];L.forEach((l,ix)=>rows.push([s.inv,fdt(s.t),s.uname,s.mechName||'',s.cname,s.vehicleNo||'',s.pay,s.void?'VOID':'OK',...l,ix?'':s.pct||0,ix?'':s.disc,ix?'':s.total]))});
  download(`sales-${rpF.from}-to-${rpF.to}.csv`,toCSV(rows),'text/csv')}

/* ===================== Activity log ===================== */
VIEWS.activity=function(){main(`<h1>Activity Log</h1><p class="muted" style="margin-top:-8px">Every login, sale, discount, void, stock and price change, credit approval, payment and wrong password attempt.</p>

  const f=()=>{const u=$('#au').value,q=$('#aq').value.toLowerCase();const L=db.log.filter(l=>(!u||l.u===u)&&(!q||(l.a+' '+l.d).toLowerCase().includes(q))).slice(-500).reverse();

VIEWS.mypw=function(){main(`<h1>Change my password</h1><div class="card" style="max-width:420px"><label>Current password</label><input id="mp_o" type="password"><label style="margin-top:10px">New password</label><input id="mp_n" type="password"><label style="margin-top:10px">Confirm</label><input id="mp_c" type="password"><div id="mp_err" class="low" style="margin-top:8px"></div><div class="mfoot" style="position:static;border:0"><button class="btn pri" onclick="doMyPw()">Change password</button></div></div>`)}
function doMyPw(){const err=m=>{$('#mp_err').textContent=m};if(hashPw($('#mp_o').value)!==me.hash)return err('Current password is wrong');const n=$('#mp_n').value;if(n.length<4)return err('At least 4 characters');if(n!==$('#mp_c').value)return err('Passwords do not match');if(hashPw(n)===db.settings.authHash)return err('Must be different from the authorization password');
  me.hash=hashPw(n);log('Password changed','own login');flush();toast('Password changed');go('dashboard')}
function authPwModal(){modal(`<h2>Change Owner Authorization Password</h2><label>Current</label><input id="ap_o" type="password"><label style="margin-top:10px">New</label><input id="ap_n" type="password"><label style="margin-top:10px">Confirm</label><input id="ap_c" type="password"><div id="ap_err" class="low" style="margin-top:8px"></div><div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="doAuthPw()">Change</button></div>`)}
function doAuthPw(){const err=m=>{$('#ap_err').textContent=m};if(!checkAuth($('#ap_o').value)){log('Auth password change FAILED','');return err('Current authorization password is wrong')}
  const n=$('#ap_n').value;if(n.length<4)return err('At least 4 characters');if(n!==$('#ap_c').value)return err('Passwords do not match');if(db.users.some(u=>u.hash===hashPw(n)))return err('Must be different from login passwords');
  db.settings.authHash=hashPw(n);log('Authorization password changed','');flush();closeModal();toast('Changed')}
function backup(){db.settings.lastBackup=Date.now();log('Backup downloaded','');flush();const name=(db.settings.shopName||'shop').replace(/[^a-z0-9]+/gi,'-').toLowerCase();download(`${name}-backup-${today()}.json`,JSON.stringify(db),'application/json');VIEWS.settings()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=async()=>{let d;try{d=JSON.parse(String(r.result))}catch(e){return alert('Not a valid backup file.')}
  if(!d||!Array.isArray(d.users)||!Array.isArray(d.parts)||!d.users.length)return alert('Not a valid backup file.');
  if(!confirm(`Restore this backup?\n\nALL current data will be REPLACED (${d.parts.length} parts, ${(d.sales||[]).length} sales). You will log in again.`))return;
  const who=me?me.name:'-';setDB(d);me=null;db.log.push({t:Date.now(),u:who,a:'Backup RESTORED',d:f.name});await flush();sessionStorage.removeItem('erp-uid');location.reload()};r.readAsText(f)}
function eraseModal(){modal(`<h2>Erase all data</h2><p>This permanently deletes <b>everything</b>: parts, sales, customers, staff, suppliers. You will set up the shop again.</p><label>Type ERASE to confirm</label><input id="er_t"><label style="margin-top:10px">Owner authorization password</label><input id="er_p" type="password"><div id="er_err" class="low" style="margin-top:8px"></div><div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn bad" onclick="doErase()">Erase everything</button></div>`)}
async function doErase(){if($('#er_t').value.trim()!=='ERASE')return $('#er_err').textContent='Type ERASE';if(!checkAuth($('#er_p').value))return $('#er_err').textContent='Wrong authorization password';
  setDB(null);await flush();try{localStorage.removeItem(LSK)}catch(e){}sessionStorage.removeItem('erp-uid');location.reload()}
